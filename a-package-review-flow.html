<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A包智能生产与提审流程图</title>
<style>
  body{margin:0;background:#020617;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;}
  .wrap{width:1600px;height:960px;margin:0 auto;background:radial-gradient(circle at 18% 10%,rgba(34,211,238,.16),transparent 28%),radial-gradient(circle at 82% 18%,rgba(167,139,250,.14),transparent 30%),#020617;position:relative;overflow:hidden;}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.08) 1px,transparent 1px);background-size:40px 40px;}
  svg{position:absolute;inset:0}
  .title{position:absolute;left:60px;top:38px;font-size:36px;font-weight:800;letter-spacing:.5px;color:#f8fafc;}
  .subtitle{position:absolute;left:62px;top:90px;font-size:18px;color:#94a3b8;}
  .badge{position:absolute;right:62px;top:48px;border:1px solid #22d3ee55;background:#08334499;color:#67e8f9;border-radius:999px;padding:10px 18px;font-size:17px;font-weight:700;}
  .foot{position:absolute;left:62px;bottom:34px;color:#64748b;font-size:15px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="grid"></div>
  <div class="title">A包智能生产 → 提审 → B包发布流程</div>
  <div class="subtitle">线性主流程：事实源沉淀 / P0卡点闭环 / ASC提交 / 审核后合并发布</div>
  <div class="badge">AI-Infra 可执行版 · 非 Mermaid</div>
  <svg width="1600" height="960" viewBox="0 0 1600 960" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/></filter>
      <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/></marker>
      <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#fb7185"/></marker>
      <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
      <linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#10b981"/></linearGradient>
      <linearGradient id="g3" x1="0" x2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
      <linearGradient id="g4" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
      <style>
        .node{filter:url(#shadow)}
        .box{rx:18;stroke-width:2.2}
        .num{font:800 19px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial;fill:#020617}
        .role{font:700 17px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial;fill:#f8fafc}
        .main{font:800 22px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial;fill:#f8fafc}
        .sub{font:500 15px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial;fill:#cbd5e1}
        .tiny{font:650 13px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial;fill:#94a3b8}
        .line{fill:none;stroke:#38bdf8;stroke-width:3;marker-end:url(#arrow)}
        .safe{fill:none;stroke:#fb7185;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#arrow2)}
      </style>
    </defs>

    <!-- main flow arrows -->
    <path class="line" d="M300 265 C345 265 360 265 405 265"/>
    <path class="line" d="M645 265 C690 265 705 265 750 265"/>
    <path class="line" d="M990 265 C1035 265 1050 265 1095 265"/>
    <path class="line" d="M1335 265 C1390 265 1415 305 1415 360 C1415 420 1370 435 1315 435"/>
    <path class="line" d="M1075 435 C1030 435 1015 435 970 435"/>
    <path class="line" d="M730 435 C685 435 670 435 625 435"/>
    <path class="line" d="M385 435 C340 435 325 435 280 435"/>
    <path class="line" d="M210 520 C210 590 270 610 360 610"/>
    <path class="line" d="M600 610 C660 610 680 610 740 610"/>
    <path class="line" d="M980 610 C1040 610 1060 610 1120 610"/>
    <path class="line" d="M1360 610 C1415 610 1435 645 1435 695 C1435 748 1388 765 1335 765"/>
    <path class="line" d="M1095 765 C1040 765 1018 765 962 765"/>
    <path class="line" d="M722 765 C664 765 640 765 582 765"/>

    <!-- feedback / guardrails -->
    <path class="safe" d="M842 835 C842 890 1390 890 1390 715"/>
    <path class="safe" d="M838 835 C838 900 140 900 140 500"/>
    <text x="690" y="910" class="tiny" fill="#fb7185">审核结果 / 黑盒验收 / 线上反馈 → 回流私有 GitHub 事实源与经验手册</text>

    <!-- nodes row 1 -->
    <g class="node" transform="translate(60 190)">
      <rect width="240" height="150" class="box" fill="rgba(8,51,68,.72)" stroke="#22d3ee"/>
      <circle cx="30" cy="30" r="16" fill="url(#g1)"/><text x="24" y="37" class="num">1</text>
      <text x="58" y="35" class="role">需求入口（业务/PMO）</text>
      <text x="28" y="78" class="main">自然语言 AppSpec</text>
      <text x="28" y="108" class="sub">选题、目标市场、差异点</text>
      <text x="28" y="132" class="sub">进入私有事实源</text>
    </g>
    <g class="node" transform="translate(405 190)">
      <rect width="240" height="150" class="box" fill="rgba(6,78,59,.72)" stroke="#34d399"/>
      <circle cx="30" cy="30" r="16" fill="url(#g2)"/><text x="24" y="37" class="num">2</text>
      <text x="58" y="35" class="role">AI Copy（A包智能体）</text>
      <text x="28" y="78" class="main">元数据草案</text>
      <text x="28" y="108" class="sub">标题、副标题、关键词</text>
      <text x="28" y="132" class="sub">隐私/协议/H5 文案</text>
    </g>
    <g class="node" transform="translate(750 190)">
      <rect width="240" height="150" class="box" fill="rgba(76,29,149,.7)" stroke="#a78bfa"/>
      <circle cx="30" cy="30" r="16" fill="url(#g4)"/><text x="24" y="37" class="num">3</text>
      <text x="58" y="35" class="role">视觉资源（设计师）</text>
      <text x="28" y="78" class="main">Logo / 启动图 / 截图</text>
      <text x="28" y="108" class="sub">商店素材与图片资源</text>
      <text x="28" y="132" class="sub">审核安全边界内生产</text>
    </g>
    <g class="node" transform="translate(1095 190)">
      <rect width="240" height="150" class="box" fill="rgba(120,53,15,.64)" stroke="#fbbf24"/>
      <circle cx="30" cy="30" r="16" fill="url(#g3)"/><text x="24" y="37" class="num">4</text>
      <text x="58" y="35" class="role">产品配置（产品）</text>
      <text x="28" y="78" class="main">域名 / 协议 / 商品</text>
      <text x="28" y="108" class="sub">同步大娱 repo 协议</text>
      <text x="28" y="132" class="sub">付费 ID、价格确认</text>
    </g>

    <!-- row 2 -->
    <g class="node" transform="translate(1075 360)">
      <rect width="240" height="150" class="box" fill="rgba(30,41,59,.82)" stroke="#94a3b8"/>
      <circle cx="30" cy="30" r="16" fill="#94a3b8"/><text x="24" y="37" class="num">5</text>
      <text x="58" y="35" class="role">Flutter MVP（生成器）</text>
      <text x="28" y="78" class="main">APK / iOS 工程</text>
      <text x="28" y="108" class="sub">功能闭环与基础埋点</text>
      <text x="28" y="132" class="sub">输出可验收构建</text>
    </g>
    <g class="node" transform="translate(730 360)">
      <rect width="240" height="150" class="box" fill="rgba(136,19,55,.62)" stroke="#fb7185"/>
      <circle cx="30" cy="30" r="16" fill="#fb7185"/><text x="24" y="37" class="num">6</text>
      <text x="58" y="35" class="role">P0 修复（A包人工）</text>
      <text x="28" y="78" class="main">提审卡点闭环</text>
      <text x="28" y="108" class="sub">崩溃、付费项、阻塞缺陷</text>
      <text x="28" y="132" class="sub">修复后回写证据</text>
    </g>
    <g class="node" transform="translate(385 360)">
      <rect width="240" height="150" class="box" fill="rgba(8,51,68,.72)" stroke="#22d3ee"/>
      <circle cx="30" cy="30" r="16" fill="url(#g1)"/><text x="24" y="37" class="num">7</text>
      <text x="58" y="35" class="role">隔离环境（运维）</text>
      <text x="28" y="78" class="main">虚拟机出包环境</text>
      <text x="28" y="108" class="sub">证书/账号/依赖隔离</text>
      <text x="28" y="132" class="sub">可复现构建日志</text>
    </g>
    <g class="node" transform="translate(40 360)">
      <rect width="240" height="150" class="box" fill="rgba(6,78,59,.72)" stroke="#34d399"/>
      <circle cx="30" cy="30" r="16" fill="url(#g2)"/><text x="24" y="37" class="num">8</text>
      <text x="58" y="35" class="role">提审清单（运维）</text>
      <text x="28" y="78" class="main">安全检查</text>
      <text x="28" y="108" class="sub">权限、截图、元数据、IAP</text>
      <text x="28" y="132" class="sub">拒审风险预检</text>
    </g>

    <!-- row 3 -->
    <g class="node" transform="translate(360 535)">
      <rect width="240" height="150" class="box" fill="rgba(120,53,15,.64)" stroke="#fbbf24"/>
      <circle cx="30" cy="30" r="16" fill="url(#g3)"/><text x="24" y="37" class="num">9</text>
      <text x="58" y="35" class="role">ASC 提交（运维）</text>
      <text x="28" y="78" class="main">上传并提交审核</text>
      <text x="28" y="108" class="sub">App Store Connect</text>
      <text x="28" y="132" class="sub">保留提交证据链</text>
    </g>
    <g class="node" transform="translate(740 535)">
      <rect width="240" height="150" class="box" fill="rgba(76,29,149,.7)" stroke="#a78bfa"/>
      <circle cx="30" cy="30" r="16" fill="url(#g4)"/><text x="23" y="37" class="num">10</text>
      <text x="62" y="35" class="role">审核等待（PMO）</text>
      <text x="28" y="78" class="main">状态跟踪</text>
      <text x="28" y="108" class="sub">拒审原因结构化入库</text>
      <text x="28" y="132" class="sub">通过则进入 B 包</text>
    </g>
    <g class="node" transform="translate(1120 535)">
      <rect width="240" height="150" class="box" fill="rgba(6,78,59,.72)" stroke="#34d399"/>
      <circle cx="30" cy="30" r="16" fill="url(#g2)"/><text x="23" y="37" class="num">11</text>
      <text x="62" y="35" class="role">B包合并（工程）</text>
      <text x="28" y="78" class="main">发布准备</text>
      <text x="28" y="108" class="sub">合并过审 A 包能力</text>
      <text x="28" y="132" class="sub">版本、商品、配置收口</text>
    </g>

    <!-- row 4 -->
    <g class="node" transform="translate(1095 705)">
      <rect width="240" height="120" class="box" fill="rgba(30,41,59,.82)" stroke="#94a3b8"/>
      <circle cx="30" cy="30" r="16" fill="#94a3b8"/><text x="23" y="37" class="num">12</text>
      <text x="62" y="35" class="role">线上反馈（运营）</text>
      <text x="28" y="78" class="main">留存 / 付费 / 下架率</text>
      <text x="28" y="104" class="sub">沉淀下一轮选题与审核经验</text>
    </g>
    <g class="node" transform="translate(722 705)">
      <rect width="240" height="120" class="box" fill="rgba(136,19,55,.58)" stroke="#fb7185"/>
      <circle cx="30" cy="30" r="16" fill="#fb7185"/><text x="23" y="37" class="num">13</text>
      <text x="62" y="35" class="role">事实源（GitHub）</text>
      <text x="28" y="78" class="main">证据/经验回流</text>
      <text x="28" y="104" class="sub">拒审案例、构建日志、验收结果</text>
    </g>
    <g class="node" transform="translate(342 705)">
      <rect width="240" height="120" class="box" fill="rgba(8,51,68,.72)" stroke="#22d3ee"/>
      <circle cx="30" cy="30" r="16" fill="url(#g1)"/><text x="23" y="37" class="num">14</text>
      <text x="62" y="35" class="role">下一轮（AI-Infra）</text>
      <text x="28" y="78" class="main">自动化增强</text>
      <text x="28" y="104" class="sub">减少人工搬运，提升过审率</text>
    </g>

    <!-- legend -->
    <g transform="translate(60 825)">
      <rect x="0" y="0" width="560" height="58" rx="14" fill="rgba(15,23,42,.78)" stroke="#334155"/>
      <circle cx="28" cy="29" r="7" fill="#38bdf8"/><text x="46" y="34" class="tiny">主流程</text>
      <circle cx="140" cy="29" r="7" fill="#fb7185"/><text x="158" y="34" class="tiny">安全/反馈闭环</text>
      <circle cx="300" cy="29" r="7" fill="#fbbf24"/><text x="318" y="34" class="tiny">产品/运维关键卡口</text>
    </g>
  </svg>
  <div class="foot">建议落地口径：先跑通“事实源→生成→提审→审核结果回流”的最短闭环，再逐段替换人工搬运。</div>
</div>
</body>
</html>
